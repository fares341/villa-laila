services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: villa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: villa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U villa -d villa"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: sh -c "npm run migrate && npm run seed"
    env_file: .env
    environment:
      DATABASE_URL: postgres://villa:${POSTGRES_PASSWORD}@db:5432/villa
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./uploads:/app/data/uploads   # event videos (kept across rebuilds)
    environment:
      DATABASE_URL: postgres://villa:${POSTGRES_PASSWORD}@db:5432/villa
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:3002:3000"

  worker:
    build: .
    command: npm run worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./uploads:/app/data/uploads   # event videos (kept across rebuilds)
    environment:
      DATABASE_URL: postgres://villa:${POSTGRES_PASSWORD}@db:5432/villa
    depends_on:
      migrate: { condition: service_completed_successfully }

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U villa villa | gzip > /backups/villa-$$(date +%F).sql.gz
          find /backups -name 'villa-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
